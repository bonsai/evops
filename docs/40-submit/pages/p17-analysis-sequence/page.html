<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>分析 シーケンス図 — 総合演習 卒業制作</title>
<style>

@page { size: A4 landscape; margin: 0; }

:root{
  --pw:297mm; --ph:210mm;
  --ink:#16191d; --ink2:#464d55; --ink3:#7b838c;
  --rule:#d5dae0; --rule2:#eceef1;
  --paper:#fff; --screen:#23262b;
  --f-ja:"Noto Sans JP","Noto Sans CJK JP","Hiragino Kaku Gothic ProN","Yu Gothic UI","Yu Gothic","Meiryo",system-ui,sans-serif;
  --f-la:"Inter","Helvetica Neue","Segoe UI",Roboto,system-ui,sans-serif;
  --f-mono:"SFMono-Regular","Cascadia Mono","Consolas","Roboto Mono",ui-monospace,monospace;
  --c-plan:#b45309;    --c-plan-bg:#fdf5ea;
  --c-deliver:#1d4ed8; --c-deliver-bg:#eef3fe;
  --c-present:#047857; --c-present-bg:#e9faf3;
  --c-app:#4b5563;     --c-app-bg:#f3f4f6;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:var(--screen)}
body{font-family:var(--f-la),var(--f-ja);color:var(--ink);-webkit-font-smoothing:antialiased}
.stage{transform-origin:top center}
.stage-inner{padding:10mm 0 18mm}

.sheet{
  position:relative;width:var(--pw);height:var(--ph);background:var(--paper);
  overflow:hidden;margin:0 auto;box-shadow:0 6px 28px rgba(0,0,0,.45);
  padding:13mm 15mm 12mm;display:flex;flex-direction:column;
  font-size:10.3pt;line-height:1.74;
  --accent:var(--c-app); --accent-bg:var(--c-app-bg);
}
.sheet+.sheet{margin-top:8mm}
.sheet::before{content:"";position:absolute;left:0;right:0;top:0;height:2.2mm;background:var(--accent)}
.sheet.cat-plan{--accent:var(--c-plan);--accent-bg:var(--c-plan-bg)}
.sheet.cat-deliver{--accent:var(--c-deliver);--accent-bg:var(--c-deliver-bg)}
.sheet.cat-present{--accent:var(--c-present);--accent-bg:var(--c-present-bg)}
.sheet.cat-app{--accent:var(--c-app);--accent-bg:var(--c-app-bg)}

.hd{display:flex;align-items:flex-end;gap:6mm;padding-bottom:2.2mm;
    border-bottom:.4mm solid var(--rule);flex:0 0 auto}
.hd-kicker{font-size:8.2pt;font-weight:800;letter-spacing:.13em;color:var(--accent);
  background:var(--accent-bg);padding:1mm 2.8mm;border-radius:1mm;white-space:nowrap}
.hd-title{font-size:15.5pt;font-weight:800;letter-spacing:.01em;line-height:1.28;flex:1 1 auto;margin:0}
.hd-title small{display:block;font-size:9pt;font-weight:500;color:var(--ink3);margin-top:.9mm;letter-spacing:.02em}
.hd-no{font-family:var(--f-mono);font-size:9pt;color:var(--ink3);white-space:nowrap}
.body{flex:1 1 auto;padding-top:4.4mm;min-height:0}

.sheet.cover{padding:0}
.cover-in{height:100%;display:flex;flex-direction:column;justify-content:center;
  padding:0 24mm;position:relative}
.cover-in::before{content:"";position:absolute;left:0;top:0;bottom:0;width:14mm;background:var(--accent)}
.cover-label{font-size:9.5pt;letter-spacing:.28em;color:var(--accent);font-weight:800;margin-bottom:6mm}
.cover-h1{font-size:30pt;font-weight:800;line-height:1.3;margin:0 0 6mm}
.cover-h2{font-size:12.5pt;font-weight:500;color:var(--ink2);line-height:1.75;margin:0 0 15mm}
.cover-meta{display:flex;gap:11mm;border-top:.4mm solid var(--rule);padding-top:6mm;font-size:10pt}
.cover-meta>div{min-width:32mm}
.cover-meta .k{font-size:8pt;letter-spacing:.14em;color:var(--ink3);display:block;margin-bottom:1.4mm}
.cover-meta .v{font-weight:700}
.cover-foot{position:absolute;left:24mm;right:24mm;bottom:11mm;font-size:8.2pt;color:var(--ink3);
  border-top:.3mm solid var(--rule2);padding-top:3mm;display:flex;justify-content:space-between}

.cols{display:grid;gap:5mm}
.c-2{grid-template-columns:1fr 1fr}
.c-3{grid-template-columns:1fr 1fr 1fr}
.c-64{grid-template-columns:6fr 4fr}
.c-46{grid-template-columns:4fr 6fr}
.c-73{grid-template-columns:7fr 3fr}
.stack>*+*{margin-top:4mm}

.card{border:.35mm solid var(--rule);border-radius:1.2mm;padding:3.4mm 4mm;background:#fff}
.card.soft{background:#fbfcfd}
.card-h{font-size:9.3pt;font-weight:800;letter-spacing:.04em;color:var(--accent);
  display:flex;align-items:center;gap:2.2mm;margin-bottom:2.4mm}
.card-h .no{font-family:var(--f-mono);font-size:7.8pt;background:var(--accent);color:#fff;
  border-radius:1mm;padding:.5mm 1.7mm;letter-spacing:0}

.h4{font-size:9.1pt;font-weight:800;color:var(--ink2);margin:3mm 0 1.3mm}
.h4:first-child{margin-top:0}
p{margin:0 0 2.3mm}
p:last-child{margin-bottom:0}
ul,ol{margin:0 0 2.3mm;padding-left:5mm}
li{margin-bottom:1mm}
ul:last-child,ol:last-child{margin-bottom:0}
small{font-size:8.5pt;color:var(--ink3)}
.lead{font-size:10.6pt;line-height:1.85}

.fill{display:inline-block;min-width:22mm;border-bottom:.35mm solid var(--ink3);height:1.1em}
.fill.l{min-width:52mm}
.fill.xl{min-width:92mm}
.blank{display:block;border-bottom:.3mm dashed var(--rule);height:6.6mm;margin-top:1.6mm}
.blank.tall{height:11mm}

.ph{border:.4mm dashed var(--rule);border-radius:1.2mm;background:#fcfdfe;position:relative;
  display:flex;align-items:center;justify-content:center;overflow:hidden}
.ph>svg{width:100%;height:100%;display:block}
.ph-cap{font-size:8.1pt;color:var(--ink3);text-align:center;margin-top:1.6mm}
.ph-tag{position:absolute;top:1.5mm;right:2mm;font-family:var(--f-mono);font-size:7.3pt;
  color:var(--ink3);background:#fff;border:.3mm solid var(--rule);border-radius:1mm;padding:.3mm 1.3mm}
.ph-title{position:absolute;top:1.4mm;left:2mm;font-size:7.9pt;font-weight:800;color:var(--ink2)}

table{width:100%;border-collapse:collapse;font-size:9.1pt}
th,td{border:.3mm solid var(--rule);padding:1.6mm 2.1mm;vertical-align:top;text-align:left}
th{background:var(--accent-bg);color:var(--accent);font-weight:800;font-size:8.7pt;letter-spacing:.03em}
td.c,th.c{text-align:center}
td.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums;white-space:nowrap}
tr.must td{background:#fff8f2}

pre{margin:0;padding:2.8mm 3.2mm;background:#11151a;color:#dde4ea;border-radius:1.2mm;
  font-family:var(--f-mono);font-size:8.2pt;line-height:1.58;white-space:pre;overflow:hidden}
pre .cm{color:#78838f}
pre .kw{color:#8fb8ff}
pre .st{color:#9ad39a}
code{font-family:var(--f-mono);font-size:8.7pt;background:#f1f3f6;padding:.2mm .8mm;border-radius:.6mm}

.note{border-left:.9mm solid var(--accent);background:var(--accent-bg);
  padding:2.6mm 3.2mm;font-size:9.1pt;border-radius:0 1mm 1mm 0}
.note b{color:var(--accent)}
.note.warn{border-left-color:#b91c1c;background:#fdf2f2}
.note.warn b{color:#b91c1c}

.check{list-style:none;padding:0;margin:0}
.check li{display:flex;gap:2.5mm;align-items:flex-start;margin-bottom:1.7mm}
.check li::before{content:"";flex:0 0 auto;width:3.8mm;height:3.8mm;margin-top:1.6mm;
  border:.35mm solid var(--ink3);border-radius:.6mm;background:#fff}

.kv{display:grid;grid-template-columns:auto 1fr;gap:1.3mm 4mm;font-size:9.1pt;align-items:baseline}
.kv dt{font-weight:800;color:var(--ink2);white-space:nowrap}
.kv dd{margin:0}

.flow{display:flex}
.flow .step{flex:1;border:.35mm solid var(--rule);border-radius:1mm;padding:2.2mm 2.4mm;
  font-size:8.7pt;text-align:center;position:relative}
.flow .step+.step{margin-left:3.2mm}
.flow .step+.step::before{content:"\203A";position:absolute;left:-3.1mm;top:50%;
  transform:translateY(-50%);color:var(--ink3);font-size:11pt}
.flow .step b{display:block;font-size:7.9pt;color:var(--accent);margin-bottom:.5mm}

.toc{display:grid;grid-template-columns:repeat(3,1fr);gap:5mm 6mm}
.toc-sec{border-top:.9mm solid var(--accent);padding-top:2.4mm}
.toc-sec h4{margin:0 0 2.2mm;font-size:10.4pt;font-weight:800;color:var(--accent);letter-spacing:.03em}
.toc-sec .dl{font-family:var(--f-mono);font-size:8pt;color:var(--ink3);margin-left:1.6mm;font-weight:400}
.toc ol{list-style:none;margin:0;padding:0}
.toc li{display:flex;gap:2.2mm;align-items:baseline;margin-bottom:1.4mm;font-size:8.8pt;cursor:pointer}
.toc li:hover{color:var(--accent)}
.toc li .pg{font-family:var(--f-mono);font-size:7.9pt;color:var(--ink3);min-width:9mm;text-align:right}
.toc li .txt{flex:1}

svg text{font-family:var(--f-la),var(--f-ja);fill:var(--ink)}
svg .t-name{font-size:11px}
svg .t-ttl{font-size:12px;font-weight:800}
svg .t-sm{font-size:9.5px;fill:#464d55}
svg .t-xs{font-size:8.4px;fill:#7b838c}
svg .t-st{font-size:8.8px;font-style:italic}
svg .box-pkg{fill:#f6f6f8;stroke:#8b9198;stroke-width:1.1}
svg .box-ent{fill:#f2f6fe;stroke:#5b83c4;stroke-width:1.1}
svg .box-ctl{fill:#fff7ea;stroke:#c08a2e;stroke-width:1.1}
svg .box-bnd{fill:#f1faf5;stroke:#4f9c78;stroke-width:1.1}
svg .uc{fill:#fff;stroke:#1d4ed8;stroke-width:1.25}
svg .lifeh{fill:#e9edf2;stroke:#6f767e;stroke-width:1.1}
svg .lifeline{stroke:#6f767e;stroke-width:1.05;stroke-dasharray:4 3}
svg .actorline{stroke:#6f767e;stroke-width:1.3;fill:none}
svg .ln{stroke:#6f767e;stroke-width:1.1;fill:none}

.sheet.divider{padding:0}
.divider-in{height:100%;display:flex;flex-direction:column;justify-content:center;padding:0 24mm;position:relative}
.divider-in::before{content:"";position:absolute;left:0;top:0;bottom:0;width:14mm;background:var(--accent)}
.divider-num{font-family:var(--f-mono);font-size:10pt;letter-spacing:.3em;color:var(--accent);font-weight:800;margin-bottom:5mm}
.divider-h1{font-size:26pt;font-weight:800;line-height:1.32;margin:0 0 5mm}
.divider-h2{font-size:11pt;font-weight:500;color:var(--ink2);line-height:1.8;margin:0 0 12mm}
.divider-list{border-top:.4mm solid var(--rule);padding-top:5mm;font-size:9.4pt;columns:2;column-gap:10mm}
.divider-list div{margin-bottom:1.6mm;break-inside:avoid}
.divider-list b{color:var(--accent);font-family:var(--f-mono);font-size:8.6pt;margin-right:2mm}
.divider-foot{position:absolute;left:24mm;right:24mm;bottom:11mm;font-size:8.2pt;color:var(--ink3);
  border-top:.3mm solid var(--rule2);padding-top:3mm;display:flex;justify-content:space-between}

.nav{position:fixed;left:50%;bottom:5mm;transform:translateX(-50%);
  display:flex;align-items:center;gap:1.6mm;
  background:rgba(20,22,26,.92);border:1px solid rgba(255,255,255,.14);
  border-radius:999px;padding:1.5mm 2.2mm;z-index:50;
  color:#e8ecf1;box-shadow:0 6px 20px rgba(0,0,0,.45)}
.nav button{all:unset;cursor:pointer;padding:1.1mm 2.6mm;border-radius:999px;color:#cfd6de;font-size:11px}
.nav button:hover{background:rgba(255,255,255,.14);color:#fff}
.nav .cur{font-family:var(--f-mono);font-size:11px;padding:0 1.6mm;min-width:22mm;
  text-align:center;color:#fff;font-variant-numeric:tabular-nums}
.nav .cur em{color:#7f8b98;font-style:normal}
.nav .sep{width:1px;height:14px;background:rgba(255,255,255,.16)}
.nav .ttl{font-size:10.4px;padding:0 1mm;color:#9aa5b1;max-width:40mm;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}

@media print{
  html,body{background:#fff!important}
  .nav{display:none!important}
  .stage{transform:none!important}
  .stage-inner{padding:0!important}
  .sheet{box-shadow:none!important;margin:0!important;break-after:page;page-break-after:always}
  .sheet:last-child{break-after:auto;page-break-after:auto}
  *{-webkit-print-color-adjust:exact!important;print-color-adjust:exact!important}
}

</style>
</head>
<body>
<div class="stage" id="stage"><div class="stage-inner" id="sheets">
<section class="sheet cat-deliver" data-t="分析 シーケンス図">
  <div class="hd">
    <span class="hd-kicker">納品物 2 — 分析モデル</span>
    <h2 class="hd-title">分析モデル：シーケンス図（イベントフローの実現）<small>UC1 の基本フローをメッセージ番号順に並べる。</small></h2>
    <span class="hd-no">17</span>
  </div>
  <div class="body">
    <div class="ph" style="height:108mm">
      <div class="ph-tag">FIG 2-2</div>
      <div class="ph-title">コミュニケーション図 → シーケンス図　UC1 の実現</div>
      <svg viewBox="0 0 720 300" preserveAspectRatio="xMidYMid meet" aria-label="分析シーケンス図">
        <defs>
          <marker id="a4" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 z" fill="#5b6470"/></marker>
          <marker id="a4o" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 z" fill="#fff" stroke="#5b6470" stroke-width="1"/></marker>
        </defs>

        <rect class="lifeh" x="24" y="14" width="112" height="30" rx="3"/>
        <text class="t-name" x="80" y="33" text-anchor="middle">利用者</text>
        <line class="lifeline" x1="80" y1="44" x2="80" y2="290"/>

        <rect class="lifeh" x="166" y="14" width="112" height="30" rx="3"/>
        <text class="t-st" x="176" y="26" fill="#4f9c78">&lt;&lt;boundary&gt;&gt;</text>
        <text class="t-name" x="222" y="38" text-anchor="middle">開始メニュー</text>
        <line class="lifeline" x1="222" y1="44" x2="222" y2="290"/>

        <rect class="lifeh" x="308" y="14" width="112" height="30" rx="3"/>
        <text class="t-st" x="318" y="26" fill="#4f9c78">&lt;&lt;boundary&gt;&gt;</text>
        <text class="t-name" x="364" y="38" text-anchor="middle">入力デバイス</text>
        <line class="lifeline" x1="364" y1="44" x2="364" y2="290"/>

        <rect class="lifeh" x="450" y="14" width="112" height="30" rx="3"/>
        <text class="t-st" x="460" y="26" fill="#b5811f">&lt;&lt;control&gt;&gt;</text>
        <text class="t-name" x="506" y="38" text-anchor="middle">○○制御</text>
        <line class="lifeline" x1="506" y1="44" x2="506" y2="290"/>

        <rect class="lifeh" x="592" y="14" width="112" height="30" rx="3"/>
        <text class="t-st" x="602" y="26" fill="#5b83c4">&lt;&lt;entity&gt;&gt;</text>
        <text class="t-name" x="648" y="38" text-anchor="middle">○○台帳</text>
        <line class="lifeline" x1="648" y1="44" x2="648" y2="290"/>

        <line x1="80" y1="72" x2="220" y2="72" stroke="#5b6470" stroke-width="1.05" marker-end="url(#a4)"/>
        <text class="t-xs" x="84" y="65">1 : 処理開始</text>
        <line x1="222" y1="102" x2="504" y2="102" stroke="#5b6470" stroke-width="1.05" stroke-dasharray="5 3" marker-end="url(#a4)"/>
        <text class="t-xs" x="226" y="95">2 : ○○開始</text>
        <line x1="506" y1="132" x2="646" y2="132" stroke="#5b6470" stroke-width="1.05" stroke-dasharray="5 3" marker-end="url(#a4)"/>
        <text class="t-xs" x="510" y="125">3 : 参照</text>
        <line x1="648" y1="158" x2="508" y2="158" stroke="#5b6470" stroke-width="1.05" stroke-dasharray="5 3" marker-end="url(#a4o)"/>
        <text class="t-xs" x="512" y="151">4 : 結果</text>
        <line x1="506" y1="184" x2="366" y2="184" stroke="#5b6470" stroke-width="1.05" stroke-dasharray="5 3" marker-end="url(#a4)"/>
        <text class="t-xs" x="370" y="177">5 : 入力要求</text>
        <line x1="364" y1="210" x2="82" y2="210" stroke="#5b6470" stroke-width="1.05" marker-end="url(#a4)"/>
        <text class="t-xs" x="150" y="203">6 : 入力値</text>
        <line x1="80" y1="236" x2="504" y2="236" stroke="#5b6470" stroke-width="1.05" marker-end="url(#a4)"/>
        <text class="t-xs" x="84" y="229">7 : 登録実行</text>
        <line x1="506" y1="262" x2="646" y2="262" stroke="#5b6470" stroke-width="1.05" stroke-dasharray="5 3" marker-end="url(#a4)"/>
        <text class="t-xs" x="510" y="255">8 : 追加</text>
        <line x1="648" y1="284" x2="508" y2="284" stroke="#5b6470" stroke-width="1.05" stroke-dasharray="5 3" marker-end="url(#a4o)"/>
        <text class="t-xs" x="512" y="277">9 : 完了通知</text>
      </svg>
    </div>
    <div class="ph-cap">図 2-2　分析モデル：シーケンス図　／　メッセージ番号は p.13 の UC1 基本フロー番号と対応させる</div>
    <div class="note" style="margin-top:3mm">
      <b>分析モデルと設計モデルの違い：</b>分析は「<b>何</b>をするか」（開発者の言語・問題領域由来・実装非依存）。
      設計は「<b>どう実装するか</b>」（言語依存・動的・クラス図中心）。同じ図形でも中身が変わる。
    </div>
  </div>
</section>
</div></div>
</body>
</html>
