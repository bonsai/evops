<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
<title id="title">EVOPS × Kaggle MLOps boundary</title><desc id="desc">EVOPS exports versioned data to Kaggle for training and validation; predictions and metrics return to EVOPS for human review.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#64748b"/></marker></defs>
<rect width="1200" height="420" rx="18" fill="#f8fafc"/>
<text x="42" y="46" font-family="sans-serif" font-size="25" font-weight="700" fill="#1e293b">EVOPS ↔ Kaggle：疎結合の実験ループ</text>
<g font-family="sans-serif">
 <rect x="40" y="95" width="300" height="210" rx="14" fill="#eef3fe" stroke="#1d4ed8" stroke-width="2"/>
 <text x="190" y="130" text-anchor="middle" font-size="23" font-weight="700" fill="#1d4ed8">EVOPS（正本）</text>
 <text x="65" y="172" font-size="17" fill="#1e293b">• SQLite / JSONL履歴</text><text x="65" y="207" font-size="17" fill="#1e293b">• 人間評価・sample_id</text><text x="65" y="242" font-size="17" fill="#1e293b">• データ版と結果を管理</text>
 <rect x="450" y="95" width="300" height="210" rx="14" fill="#fdf5ea" stroke="#b45309" stroke-width="2"/>
 <text x="600" y="130" text-anchor="middle" font-size="23" font-weight="700" fill="#b45309">Kaggle（実験）</text>
 <text x="475" y="172" font-size="17" fill="#1e293b">• Dataset版を固定</text><text x="475" y="207" font-size="17" fill="#1e293b">• baseline / ML学習</text><text x="475" y="242" font-size="17" fill="#1e293b">• MAE / RMSE・予測出力</text>
 <rect x="860" y="95" width="300" height="210" rx="14" fill="#e9faf3" stroke="#047857" stroke-width="2"/>
 <text x="1010" y="130" text-anchor="middle" font-size="23" font-weight="700" fill="#047857">人間（判断）</text>
 <text x="885" y="172" font-size="17" fill="#1e293b">• 予測と実評価を比較</text><text x="885" y="207" font-size="17" fill="#1e293b">• 採用モデル・閾値決定</text><text x="885" y="242" font-size="17" fill="#1e293b">• 自動採用を段階導入</text>
 <path d="M340 155 H440" fill="none" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>
 <text x="390" y="143" text-anchor="middle" font-size="14" fill="#475569">export</text>
 <path d="M750 200 H850" fill="none" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>
 <text x="800" y="188" text-anchor="middle" font-size="14" fill="#475569">predict</text>
 <path d="M450 270 H350" fill="none" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>
 <text x="400" y="293" text-anchor="middle" font-size="14" fill="#475569">CSV / JSONL import</text>
 <text x="600" y="354" text-anchor="middle" font-size="18" font-weight="700" fill="#334155">データ・Notebook・モデルの版を記録し、再現可能な実験にする</text>
 <text x="600" y="386" text-anchor="middle" font-size="15" fill="#64748b">Kaggleは実験環境。EVOPSの履歴・評価ループを置き換えない。</text>
</g></svg>
