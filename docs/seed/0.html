<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>MCP2MCP Loop: Intent → Prompt → Code → Image → VLM Eval → DB → Feedback</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:#0b1020;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;font-family:"Noto Sans JP",system-ui,sans-serif}
  svg{width:100%;max-width:1400px;height:auto}
  .node{filter:drop-shadow(0 4px 12px rgba(0,0,0,.4))}
  .edge{fill:none;stroke:#64748b;stroke-width:2.5;marker-end:url(#arrow)}
  .edge.loop{stroke:#3b82f6;stroke-dasharray:6 4}
  .label{font-size:13px;fill:#e2e8f0;text-anchor:middle}
  .label-bold{font-weight:700;fill:#f8fafc}
  .tag{font-size:11px;fill:#94a3b8;text-anchor:middle}
  .legend{font-size:12px;fill:#64748b}
  @media print{body{background:#fff}svg{width:297mm;height:210mm}}
</style>
</head>
<body>
<svg viewBox="0 0 1400 900" preserveAspectRatio="xMidYMid meet" role="img" aria-label="MCP-to-MCP feedback loop architecture">
<defs>
  <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
    <path d="M0 0 L10 3 L0 6 z" fill="#64748b"/>
  </marker>
  <linearGradient id="gUser" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#3b82f6"/><stop offset="100%" stop-color="#1d4ed8"/>
  </linearGradient>
  <linearGradient id="gGen" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#8b5cf6"/><stop offset="100%" stop-color="#6d28d9"/>
  </linearGradient>
  <linearGradient id="gEval" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#10b981"/><stop offset="100%" stop-color="#047857"/>
  </linearGradient>
  <linearGradient id="gDB" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#f59e0b"/><stop offset="100%" stop-color="#b45309"/>
  </linearGradient>
  <linearGradient id="gLoop" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#ef4444"/><stop offset="100%" stop-color="#b91c1c"/>
  </linearGradient>
  <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
    <feGaussianBlur stdDeviation="4" result="blur"/>
    <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
</defs>

<!-- Title -->
<text x="700" y="40" text-anchor="middle" font-size="24" font-weight="800" fill="#f8fafc">MCP-to-MCP Feedback Loop Architecture</text>
<text x="700" y="64" text-anchor="middle" font-size="13" fill="#64748b">Intent → Prompt → Code (bpy/SVG) → PNG → VLM Eval → DB → Repair → Re-prompt</text>

<!-- Nodes: MCP Servers as rounded rects -->
<!-- USER / INTENT -->
<g class="node" transform="translate(80,160)">
  <rect x="0" y="0" width="220" height="140" rx="14" fill="url(#gUser)" opacity=".9"/>
  <rect x="0" y="0" width="220" height="140" rx="14" fill="none" stroke="#3b82f6" stroke-width="2"/>
  <text x="110" y="38" class="label-bold">MCP: User Intent</text>
  <text x="110" y="62" class="label">自然言語</text>
  <text x="110" y="82" class="label">「ドラえもんを描いて」</text>
  <text x="110" y="110" class="tag">入力: intent_text</text>
</g>

<!-- PROMPT ENGINEER -->
<g class="node" transform="translate(360,160)">
  <rect x="0" y="0" width="220" height="140" rx="14" fill="url(#gGen)" opacity=".9"/>
  <rect x="0" y="0" width="220" height="140" rx="14" fill="none" stroke="#8b5cf6" stroke-width="2"/>
  <text x="110" y="38" class="label-bold">MCP: Prompt Engineer</text>
  <text x="110" y="62" class="label">テンプレート展開</text>
  <text x="110" y="82" class="label">3D bpy / 2D SVG</text>
  <text x="110" y="110" class="tag">出力: prompt_json</text>
</g>

<!-- CODE GENERATOR (bpy / SVG) -->
<g class="node" transform="translate(640,160)">
  <rect x="0" y="0" width="220" height="140" rx="14" fill="url(#gGen)" opacity=".9"/>
  <rect x="0" y="0" width="220" height="140" rx="14" fill="none" stroke="#8b5cf6" stroke-width="2"/>
  <text x="110" y="38" class="label-bold">MCP: Code Generator</text>
  <text x="110" y="62" class="label">Python 実行</text>
  <text x="110" y="82" class="label">bpy / svgwrite</text>
  <text x="110" y="110" class="tag">出力: code.py + PNG</text>
</g>

<!-- RENDER / IMAGE -->
<g class="node" transform="translate(920,160)">
  <rect x="0" y="0" width="220" height="140" rx="14" fill="url(#gGen)" opacity=".9"/>
  <rect x="0" y="0" width="220" height="140" rx="14" fill="none" stroke="#8b5cf6" stroke-width="2"/>
  <text x="110" y="38" class="label-bold">MCP: Renderer</text>
  <text x="110" y="62" class="label">Blender headless</text>
  <text x="110" y="82" class="label">SVG → PNG</text>
  <text x="110" y="110" class="tag">出力: image.png</text>
</g>

<!-- VLM EVALUATOR -->
<g class="node" transform="translate(1150,400)">
  <rect x="0" y="0" width="220" height="140" rx="14" fill="url(#gEval)" opacity=".9"/>
  <rect x="0" y="0" width="220" height="140" rx="14" fill="none" stroke="#10b981" stroke-width="2"/>
  <text x="110" y="38" class="label-bold">MCP: VLM Evaluator</text>
  <text x="110" y="62" class="label">CLIP-small / LMS</text>
  <text x="110" y="82" class="label">semantic similarity</text>
  <text x="110" y="110" class="tag">出力: score, tags, repair</text>
</g>

<!-- DB -->
<g class="node" transform="translate(920,600)">
  <rect x="0" y="0" width="220" height="140" rx="14" fill="url(#gDB)" opacity=".9"/>
  <rect x="0" y="0" width="220" height="140" rx="14" fill="none" stroke="#f59e0b" stroke-width="2"/>
  <text x="110" y="38" class="label-bold">MCP: DB (SQLite)</text>
  <text x="110" y="62" class="label">loop_history</text>
  <text x="110" y="82" class="label">prompt, score, tags</text>
  <text x="110" y="110" class="tag">蓄積・学習用データ</text>
</g>

<!-- REPAIR / FEEDBACK -->
<g class="node" transform="translate(640,600)">
  <rect x="0" y="0" width="220" height="140" rx="14" fill="url(#gLoop)" opacity=".9"/>
  <rect x="0" y="0" width="220" height="140" rx="14" fill="none" stroke="#ef4444" stroke-width="2"/>
  <text x="110" y="38" class="label-bold">MCP: Repair Agent</text>
  <text x="110" y="62" class="label">修復指示生成</text>
  <text x="110" y="82" class="label">LLM → prompt修正</text>
  <text x="110" y="110" class="tag">出力: new_prompt</text>
</g>

<!-- ORCHESTRATOR -->
<g class="node" transform="translate(360,400)">
  <rect x="0" y="0" width="220" height="140" rx="14" fill="#1e293b" opacity=".95"/>
  <rect x="0" y="0" width="220" height="140" rx="14" fill="none" stroke="#3b82f6" stroke-width="2" stroke-dasharray="4 3"/>
  <text x="110" y="38" class="label-bold">Orchestrator</text>
  <text x="110" y="62" class="label">Service Layer</text>
  <text x="110" y="82" class="label">ループ制御・閾値判定</text>
  <text x="110" y="110" class="tag">max_iter / threshold</text>
</g>

<!-- EDGES: forward flow -->
<path class="edge" d="M300 230 H360"/>
<path class="edge" d="M580 230 H640"/>
<path class="edge" d="M860 230 H920"/>

<!-- Down from Render to VLM -->
<path class="edge" d="M1030 300 V400"/>

<!-- VLM to DB -->
<path class="edge" d="M1150 470 V600"/>

<!-- DB to Repair -->
<path class="edge" d="M920 670 H860"/>

<!-- Repair to Orchestrator -->
<path class="edge" d="M750 600 V470"/>

<!-- Orchestrator to Prompt Engineer (loop back) -->
<path class="edge loop" d="M360 300 V160 H470" marker-end="url(#arrow)"/>

<!-- Orchestrator to User Intent (done) -->
<path class="edge loop" d="M360 160 V100 H190" marker-end="url(#arrow)"/>

<!-- Annotations: data flow labels -->
<text x="430" y="150" class="label" font-size="11">prompt_json</text>
<text x="710" y="150" class="label" font-size="11">code.py</text>
<text x="990" y="150" class="label" font-size="11">image.png</text>
<text x="1200" y="360" class="label" font-size="11" text-anchor="end">score + tags</text>
<text x="1030" y="580" class="label" font-size="11" text-anchor="end">history</text>
<text x="800" y="660" class="label" font-size="11">repair_inst</text>
<text x="470" y="450" class="label" font-size="11" fill="#3b82f6">再プロンプト</text>

<!-- Threshold box -->
<g transform="translate(360,560)">
  <rect x="0" y="0" width="220" height="70" rx="8" fill="#1e293b" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="110" y="24" class="label-bold" font-size="12">判定閾値</text>
  <text x="110" y="44" class="label" font-size="11">sim ≥ 0.85 → 完了</text>
  <text x="110" y="60" class="label" font-size="11">sim < 0.85 → 修復ループ</text>
</g>

<!-- MCP stdio connections legend -->
<g transform="translate(50,750)">
  <rect x="0" y="0" width="1300" height="110" rx="8" fill="#11151a" stroke="#334155" stroke-width="1"/>
  <text x="20" y="24" class="label-bold" fill="#94a3b8">MCP stdio 接続（各サーバー独立プロセス）</text>
  <g transform="translate(20,40)">
    <circle cx="0" cy="0" r="6" fill="#3b82f6"/><text x="16" y="4" class="label" font-size="12" text-anchor="start">User Intent</text>
    <circle cx="200" cy="0" r="6" fill="#8b5cf6"/><text x="216" y="4" class="label" font-size="12" text-anchor="start">Prompt/Code/Render</text>
    <circle cx="460" cy="0" r="6" fill="#10b981"/><text x="476" y="4" class="label" font-size="12" text-anchor="start">VLM Evaluator</text>
    <circle cx="680" cy="0" r="6" fill="#f59e0b"/><text x="696" y="4" class="label" font-size="12" text-anchor="start">DB (SQLite)</text>
    <circle cx="920" cy="0" r="6" fill="#ef4444"/><text x="936" y="4" class="label" font-size="12" text-anchor="start">Repair Agent</text>
  </g>
  <text x="20" y="85" class="label" font-size="11" fill="#64748b">Orchestrator (Service層) が stdio で各 MCP サーバーを起動・制御し、JSON-RPC でデータを受け渡す</text>
</g>

<!-- Key insight -->
<g transform="translate(50,870)">
  <rect x="0" y="0" width="1300" height="40" rx="6" fill="rgba(59,130,246,.15)" stroke="#3b82f6" stroke-width="1"/>
  <text x="650" y="26" text-anchor="middle" class="label" font-size="12" fill="#3b82f6">💡 Intent embedding と VLM output embedding の cosine similarity で「意図との齟齬」を定量化し、閾値未満なら Repair Agent が具体的な修復指示（欠落要素・構造違い・スタイル不一致）を生成して Prompt Engineer へ戻す</text>
</g>
</svg>
</body>
</html>
