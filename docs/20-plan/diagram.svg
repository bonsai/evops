<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800">
  <defs>
    <style>
      .box { fill:#1a1a2e; stroke:#16213e; stroke-width:2; rx:8; }
      .box-text { fill:#ffffff; font-family:"Noto Sans CJK JP",sans-serif; font-size:20; dominant-baseline:middle; text-anchor:middle; }
      .arrow { fill:none; stroke:#e94560; stroke-width:3; marker-end:url(#arrowhead); }
      .arrowhead { refX:8; refY:4; width:8; height:8; fill:#e94560; }
      .label { fill:#8892b0; font-size:14; font-family:"Noto Sans CJK JP",sans-serif; }
    </style>
    <marker id="arrowhead" markerWidth="10" markerHeight:10>
  </defs>
  
  <!-- Title -->
  <text x="600" y="40" class="box-text" text-anchor="middle" fill="#e94560">SSSS System Diagram</text>
  
  <!-- LMS/VLM Evaluator -->
  <g transform="translate(100, 150)">
    <rect class="box" width="200" height="100"/>
    <text x="100" y="50" class="box-text">LMS/VLM Evaluator</text>
  </g>
  
  <!-- DB -->
  <g transform="translate(350, 300)">
    <rect class="box" width="200" height="100"/>
    <text x="100" y="50" class="box-text">DB / JSONL</text>
  </g>
  
  <!-- ML Improvement -->
  <g transform="translate(600, 150)">
    <rect class="box" width="200" height="100"/>
    <text x="100" y="50" class="box-text">ML / Improvement</text>
  </g>
  
  <!-- Regenerate -->
  <g transform="translate(850, 300)">
    <rect class="box" width="200" height="100"/>
    <text x="100" y="50" class="box-text">Regenerate</text>
  </g>
  
  <!-- Arrows -->
  <path class="arrow" d="M200 150 L350 150"/>
  <path class="arrow" d="M350 200 L350 300"/>
  <path class="arrow" d="M500 200 L600 200"/>
  <path class="arrow" d="M600 200 L600 300"/>
  <path class="arrow" d="M700 200 L850 200"/>
  <path class="arrow" d="M850 200 L850 300"/>
  
  <!-- Backend Boxes (bottom row) -->
  <g transform="translate(100, 500)">
    <rect class="box" width="200" height="100"/>
    <text x="100" y="50" class="box-text">Blender/bpy</text>
  </g>
  
  <g transform="translate(350, 500)">
    <rect class="box" width="200" height="100"/>
    <text x="100" y="50" class="box-text">SVG/CSS</text>
  </g>
  
  <g transform="translate(600, 500)">
    <rect class="box" width="200" height="100"/>
    <text x="100" y="50" class="box-text">SD1.5</text>
  </g>
  
  <g transform="translate(850, 500)">
    <rect class="box" width="200" height="100"/>
    <text x="100" y="50" class="box-text">Blender MCP</text>
  </g>
  
  <!-- Evaluation Model Tags (top) -->
  <g transform="translate(100, 50)">
    <text x="100" y="80" class="label">CLIP</text>
    <text x="160" y="80" class="label">PickScore</text>
    <text x="220" y="80" class="label">ImageReward</text>
    <text x="280" y="80" class="label">HPSv2</text>
  </g>
  
  <!-- Protocol Tags -->
  <g transform="translate(500, 50)">
    <text x="500" y="80" class="label">MCP</text>
    <text x="560" y="80" class="label">A2A</text>
  </g>
  
  <!-- SLM Tags -->
  <g transform="translate(900, 50)">
    <text x="900" y="80" class="label">Phi-3</text>
    <text x="960" y="80" class="label">Llama 3.2</text>
  </g>
</svg>