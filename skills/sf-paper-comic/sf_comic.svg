<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <style>
      .panel { fill: #f0f4ff; stroke: #334; stroke-width: 2; rx: 8; }
      .stick { stroke: #000; stroke-width: 2.5; stroke-linecap: round; }
      .head { fill: #ffeebb; stroke: #000; stroke-width: 1.5; }
      .text { font-family: "Noto Sans JP", sans-serif; font-size: 13px; fill: #222; }
      .label { font-family: sans-serif; font-weight: bold; font-size: 11px; fill: #7c3aed; }
    </style>
  </defs>

  <!-- Background -->
  <rect x="20" y="20" width="760" height="560" fill="#faf8ff" rx="12"/>

  <!-- Title -->
  <text x="400" y="55" text-anchor="middle" font-family="sans-serif" font-size="22" font-weight="bold" fill="#7c3aed">SF 落語 — 論文評価→知識の進化</text>

  <!-- Panel 1 (Problem) -->
  <rect x="30" y="80" width="350" height="220" class="panel"/>
  <text x="205" y="105" text-anchor="middle" class="label">1. 問題提起</text>
  <!-- Stick figure (researcher confused) -->
  <line x1="120" y1="240" x2="120" y2="180" class="stick"/>
  <circle cx="120" cy="165" r="14" class="head"/>
  <line x1="120" y1="240" x2="90" y2="260" class="stick"/>
  <line x1="120" y1="240" x2="150" y2="260" class="stick"/>
  <line x1="120" y1="180" x2="100" y2="150" class="stick"/>
  <line x1="120" y1="180" x2="140" y2="150" class="stick"/>
  <text x="205" y="280" text-anchor="middle" class="text">「論文の評価はできるが、</text>
  <text x="205" y="298" text-anchor="middle" class="text">知識にどう繋がる？」</text>

  <!-- Panel 2 (Method) -->
  <rect x="410" y="80" width="350" height="220" class="panel"/>
  <text x="585" y="105" text-anchor="middle" class="label">2. 手法</text>
  <!-- Stick figure (using evaluation axes) -->
  <line x1="500" y1="240" x2="500" y2="180" class="stick"/>
  <circle cx="500" cy="165" r="14" class="head"/>
  <line x1="500" y1="240" x2="470" y2="260" class="stick"/>
  <line x1="500" y1="240" x2="530" y2="260" class="stick"/>
  <line x1="500" y1="180" x2="470" y2="150" class="stick"/>
  <line x1="500" y1="180" x2="530" y2="150" class="stick"/>
  <!-- Chart bars showing axes -->
  <rect x="550" y="200" width="18" height="30" fill="#7c3aed" rx="2"/>
  <rect x="575" y="215" width="18" height="15" fill="#7c3aed" rx="2" opacity="0.6"/>
  <rect x="600" y="190" width="18" height="40" fill="#7c3aed" rx="2" opacity="0.4"/>
  <text x="585" y="280" text-anchor="middle" class="text">評価軸（CLIP・色彩・構造）</text>
  <text x="585" y="298" text-anchor="middle" class="text">を組み合わせて分析</text>

  <!-- Panel 3 (Breakthrough) -->
  <rect x="30" y="320" width="350" height="220" class="panel"/>
  <text x="205" y="345" text-anchor="middle" class="label">3. 突破</text>
  <!-- Stick figure (lightbulb) -->
  <line x1="120" y1="490" x2="120" y2="430" class="stick"/>
  <circle cx="120" cy="415" r="14" class="head"/>
  <line x1="120" y1="490" x2="90" y2="510" class="stick"/>
  <line x1="120" y1="490" x2="150" y2="510" class="stick"/>
  <line x1="120" y1="430" x2="100" y2="400" class="stick"/>
  <line x1="120" y1="430" x2="140" y2="400" class="stick"/>
  <!-- Lightbulb -->
  <circle cx="170" cy="410" r="15" fill="#ffe066" stroke="#222" stroke-width="1.5"/>
  <line x1="170" y1="425" x2="170" y2="445" stroke="#222" stroke-width="1.5"/>
  <text x="205" y="525" text-anchor="middle" class="text">評価ループの中から</text>
  <text x="205" y="543" text-anchor="middle" class="text">「成長パターン」が見えた！</text>

  <!-- Panel 4 (Connection) -->
  <rect x="410" y="320" width="350" height="220" class="panel"/>
  <text x="585" y="345" text-anchor="middle" class="label">4. つながり</text>
  <!-- Stick figure (pointing to connection) -->
  <line x1="500" y1="490" x2="500" y2="430" class="stick"/>
  <circle cx="500" cy="415" r="14" class="head"/>
  <line x1="500" y1="490" x2="470" y2="510" class="stick"/>
  <line x1="500" y1="490" x2="530" y2="510" class="stick"/>
  <line x1="500" y1="430" x2="470" y2="400" class="stick"/>
  <line x1="500" y1="430" x2="530" y2="400" class="stick"/>
  <!-- Arrow connecting to next -->
  <path d="M580 440 Q620 420 640 460" fill="none" stroke="#7c3aed" stroke-width="3" stroke-linecap="round"/>
  <polygon points="640,460 630,455 635,465" fill="#7c3aed"/>
  <text x="585" y="525" text-anchor="middle" class="text">生成→評価→修正→再生成</text>
  <text x="585" y="543" text-anchor="middle" class="text">のループが「知識」になる</text>

  <!-- Bottom note -->
  <text x="400" y="580" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#888">SF 落語四コマ / SVG / 棒人間版 / 自動生成</text>
</svg>
