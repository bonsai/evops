<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ML Ontology Graph</title>
<style>
:root{font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#17202a;background:#f7f8fa}
body{margin:0;overflow:hidden}.top{position:fixed;z-index:2;left:20px;top:16px;max-width:520px}.top h1{margin:0 0 6px;font-size:22px}.top p{margin:0;font-size:13px;color:#667085}.panel{position:fixed;z-index:3;right:18px;top:18px;width:280px;background:#fff;border:1px solid #dfe3e8;border-radius:12px;padding:14px;box-shadow:0 8px 30px #0001}.panel h2{font-size:16px;margin:0 0 7px}.panel p{font-size:13px;line-height:1.55;margin:0}.legend{margin-top:10px;font-size:12px;color:#667085}.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin:0 4px 0 10px;background:#888}.dot:first-child{margin-left:0}.hint{position:fixed;z-index:2;bottom:14px;left:20px;font-size:12px;color:#667085}
svg{width:100vw;height:100vh;display:block}line{stroke:#aeb6c2;stroke-width:1.2;opacity:.7}.edge-label{font-size:9px;fill:#8a93a0}.node{cursor:pointer}.node circle{stroke:#fff;stroke-width:2;transition:.15s}.node:hover circle,.node.selected circle{stroke:#17202a;stroke-width:3}.node text{font-size:11px;fill:#17202a;pointer-events:none;text-anchor:middle;dominant-baseline:central}.group-core circle{fill:#111827}.group-entity circle{fill:#6b7280}.group-operator circle{fill:#2563eb}.group-optimization circle{fill:#16a34a}.group-core text,.group-core text{fill:#fff}
</style>
</head>
<body>
<div class="top"><h1>ML Ontology Graph</h1><p>Intent / Reference に近い生成手法を、評価履歴から学習・選択・淘汰・進化させる。</p><div class="legend"><span class="dot" style="background:#111827"></span>Core <span class="dot" style="background:#6b7280"></span>Entity <span class="dot" style="background:#2563eb"></span>Operator <span class="dot" style="background:#16a34a"></span>Optimization</div></div>
<div class="panel"><h2>ノードを選択</h2><p>グラフ上の概念をクリックすると定義を表示します。</p></div>
<div class="hint">drag: 移動　·　wheel: zoom　·　click: 詳細</div>
<svg id="graph" viewBox="0 0 1400 900" aria-label="ML ontology graph"></svg>
<script>
const ontology={"entities":{"Intent":"生成目的・要求","Reference":"お手本","Method":"生成戦略","MethodFamily":"生成手法の系統","Genome":"探索可能なMethod表現","Candidate":"生成候補","Artifact":"生成成果物","Evaluation":"VLM/LMS/数値/人間による評価","Criterion":"評価軸","Score":"評価値","Fitness":"生存適応度","Failure":"失敗","Repair":"改善操作","Mutation":"遺伝子変異","Crossover":"遺伝子交叉","Selection":"次世代選択","Elimination":"手法淘汰","Elite":"優良候補","Generation":"探索世代","Population":"候補集合","Diversity":"多様性","Stagnation":"改善停滞","Restart":"探索リセット","Complexity":"複雑さ・コスト","Uncertainty":"評価不確実性","History":"実験履歴","Model":"履歴から学習する予測・ランキングモデル"},"operators":["score","rank","predict","select","mutate","crossover","repair","kill","restart"],"optimization":["random_search","bayesian_optimization","evolutionary_search","GA","NSGA-II","MAP-Elites"],"core":["Intent","Reference","GenerationMethod","Candidate","Artifact","Evaluation","Fitness","Learning","Selection","Evolution"]};
const svg=document.querySelector("#graph"), W=1400,H=900, cx=650,cy=455;
const alias={GenerationMethod:"Method",Learning:"Model",Evolution:"Generation"};
const nodes=[], seen=new Set();
function add(id,group,label,desc){id=alias[id]||id;if(seen.has(id))return;seen.add(id);nodes.push({id,group,label:label||id,desc,x:cx,y:cy});}
Object.entries(ontology.entities).forEach(([k,v])=>add(k,"entity",k,v));
ontology.core.forEach(k=>add(k,"core",k,ontology.entities[k]||k));
ontology.operators.forEach(k=>add(k,"operator",k,"ontology operator"));
ontology.optimization.forEach(k=>add(k,"optimization",k,"search / optimization method"));
const edges=[
["Intent","Method"],["Reference","Method"],["MethodFamily","Method"],["Method","Genome"],["Genome","Candidate"],["Candidate","Artifact"],["Artifact","Evaluation"],["Evaluation","Criterion"],["Evaluation","Score"],["Score","Fitness"],["Fitness","Selection"],["Selection","Elite"],["Selection","Elimination"],["Selection","Mutation"],["Selection","Crossover"],["Selection","Repair"],["Population","Candidate"],["Generation","Population"],["Diversity","Population"],["Stagnation","Restart"],["Restart","Method"],["History","Evaluation"],["History","Model"],["Model","Selection"],["Complexity","Fitness"],["Uncertainty","Evaluation"],["Failure","Repair"],["Failure","Elimination"],["Mutation","Genome"],["Crossover","Genome"],["Evaluation","History"],["Fitness","History"]
];
const valid=edges.filter(([a,b])=>seen.has(a)&&seen.has(b));
const g={};nodes.forEach(n=>g[n.id]=[]);
valid.forEach(([a,b])=>{g[a].push(b);g[b].push(a)});
nodes.forEach((n,i)=>{
 const angle=(i/nodes.length)*Math.PI*2;
 const r=n.group==="core"?95:(n.group==="operator"||n.group==="optimization"?285:390);
 n.x=cx+Math.cos(angle)*r; n.y=cy+Math.sin(angle)*r*.72;
});
const esc=s=>s.replace(/[&<>"]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]));
const lines=valid.map(([a,b])=>{const A=g[a],B=g[b];return "";});
function render(){
 svg.innerHTML="";
 valid.forEach(([a,b])=>{const A=nodes.find(n=>n.id===a),B=nodes.find(n=>n.id===b);const l=document.createElementNS("http://www.w3.org/2000/svg","line");l.setAttribute("x1",A.x);l.setAttribute("y1",A.y);l.setAttribute("x2",B.x);l.setAttribute("y2",B.y);svg.appendChild(l)});
 nodes.forEach(n=>{const q=document.createElementNS("http://www.w3.org/2000/svg","g");q.classList.add("node","group-"+n.group);q.dataset.id=n.id;const c=document.createElementNS("http://www.w3.org/2000/svg","circle");c.setAttribute("cx",n.x);c.setAttribute("cy",n.y);c.setAttribute("r",n.group==="core"?34:25);const t=document.createElementNS("http://www.w3.org/2000/svg","text");t.setAttribute("x",n.x);t.setAttribute("y",n.y);t.textContent=n.label;q.append(c,t);q.onmousedown=e=>{drag=q;dragNode=n;ox=e.clientX;oy=e.clientY};q.onclick=e=>{e.stopPropagation();document.querySelectorAll(".selected").forEach(x=>x.classList.remove("selected"));q.classList.add("selected");document.querySelector(".panel").innerHTML="<h2>"+esc(n.label)+"</h2><p>"+esc(n.desc)+"</p><div class='legend'>type: "+n.group+"</div>"};svg.appendChild(q)});
}
let drag=null,dragNode=null,ox=0,oy=0;
svg.onmousemove=e=>{if(!drag)return;const r=svg.getBoundingClientRect();dragNode.x=(e.clientX-r.left)/r.width*W;dragNode.y=(e.clientY-r.top)/r.height*H;render()};
svg.onmouseup=()=>{drag=null;dragNode=null};svg.onmouseleave=()=>{drag=null;dragNode=null};
svg.onclick=()=>document.querySelectorAll(".selected").forEach(x=>x.classList.remove("selected"));
render();
</script>
</body>
</html>
