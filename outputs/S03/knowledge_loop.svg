<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 560" class="animation-page">
  <!-- Title -->
  <text x="320" y="40" font-family="IPAexGothic" font-size="32" fill="#2C3E50" text-anchor="middle" font-weight="bold">
    生成→評価→修正→再生成。知識とはループである
  </text>
  
  <!-- Panel area -->
  <g id="panel-group" transform="translate(40, 100)">
    <!-- Panel 1: Hachikou struggling with evaluation -->
    <g id="panel-1" opacity="1">
      <rect x="0" y="0" width="600" height="380" fill="#FFF8E1" rx="8"/>
      <text x="300" y="40" font-family="IPAexGothic" font-size="20" fill="#3E2723" text-anchor="middle">
        コマ1：はっちゃんの悩み
      </text>
      <circle cx="100" cy="150" r="35" fill="#FFCCBC"/>
      <text x="80" y="170" font-family="IPAexGothic" font-size="16" fill="#3E2723">はっちゃん</text>
      <text x="80" y="200" font-family="IPAexGothic" font-size="14" fill="#3E2723">評価はできるが、</text>
      <text x="80" y="220" font-family="IPAexGothic" font-size="14" fill="#3E2723">知識にどう繋がる？</text>
      <ellipse cx="500" cy="200" rx="80" ry="30" fill="#E3F2FD" stroke="#1976D2" stroke-width="2"/>
      <text x="500" y="205" font-family="IPAexGothic" font-size="12" fill="#1565C0" text-anchor="middle">精度: 98.5%</text>
    </g>
    
    <!-- Panel 2: Rokkyu sensei explaining -->
    <g id="panel-2" opacity="0">
      <rect x="0" y="0" width="600" height="380" fill="#E8F5E9" rx="8"/>
      <text x="300" y="40" font-family="IPAexGothic" font-size="20" fill="#2E7D32" text-anchor="middle">
        コマ2：ご隠居さんの助言
      </text>
      <circle cx="100" cy="150" r="35" fill="#FFE0B2"/>
      <text x="80" y="170" font-family="IPAexGothic" font-size="16" fill="#3E2723">ご隠居さん</text>
      <text x="80" y="200" font-family="IPAexGothic" font-size="14" fill="#3E2723">細粒度評価を</text>
      <text x="80" y="220" font-family="IPAexGothic" font-size="14" fill="#3E2723">自動評価へ変換するんだ</text>
      <text x="80" y="260" font-family="IPAexGothic" font-size="14" fill="#1B5E20">自動評価エンジン → 設定ファイル変更</text>
    </g>
    
    <!-- Panel 3: Hachikou sees patterns -->
    <g id="panel-3" opacity="0">
      <rect x="0" y="0" width="600" height="380" fill="#E3F2FD" rx="8"/>
      <text x="300" y="40" font-family="IPAexGothic" font-size="20" fill="#1565C0" text-anchor="middle">
        コマ3：成長パターン発見
      </text>
      <circle cx="100" cy="150" r="35" fill="#BBDEFB"/>
      <text x="80" y="170" font-family="IPAexGothic" font-size="16" fill="#3E2723">はっちゃん</text>
      <text x="80" y="200" font-family="IPAexGothic" font-size="14" fill="#3E2723">評価ループの中から</text>
      <text x="80" y="220" font-family="IPAexGothic" font-size="14" fill="#3E2723">成長パターンが見えた！</text>
      <text x="200" y="350" font-family="IPAexGothic" font-size="16" fill="#0D47A1">
        パターンA: 評価頻度の上昇<br>
        パターンB: エラータイプの変化
      </text>
    </g>
    
    <!-- Panel 4: The knowledge loop -->
    <g id="panel-4" opacity="0">
      <rect x="0" y="0" width="600" height="380" fill="#F3E5F5" rx="8"/>
      <text x="300" y="40" font-family="IPAexGothic" font-size="20" fill="#7B1FA2" text-anchor="middle">
        コマ4：知識はループである
      </text>
      <text x="100" y="150" font-family="IPAexGothic" font-size="18" fill="#5E35A1">
        生成→評価→修正→再生成
      </text>
      <text x="100" y="190" font-family="IPAexGothic" font-size="16" fill="#5E35A1">
        知識とは「循環」である
      </text>
      <circle cx="300" cy="250" r="80" fill="#FFF3E0" stroke="#FF9800" stroke-width="3"/>
      <text x="300" y="260" font-family="IPAexGothic" font-size="14" fill="#FF9800" text-anchor="middle">loop</text>
      <line x1="200" y1="200" x2="400" y2="200" stroke="#FF9800" stroke-width="3"/>
      <line x1="300" y1="150" x2="300" y2="250" stroke="#FF9800" stroke-width="3"/>
      <text x="20" y="340" font-family="IPAexGothic" font-size="14" fill="#5E35A1">→</text>
      <text x="440" y="340" font-family="IPAexGothic" font-size="14" fill="#5E35A1">→</text>
    </g>
  </g>
  
  <!-- SMIL Animation -->
  <animateTransform
    xlink:href="#panel-2"
    attributeName="opacity"
    dur="2s"
    begin="1s"
    values="0;1"
    fill="freeze"/>
    
  <animateTransform
    xlink:href="#panel-3"
    attributeName="opacity"
    dur="2s"
    begin="3s"
    values="0;1"
    fill="freeze"/>
    
  <animateTransform
    xlink:href="#panel-4"
    attributeName="opacity"
    dur="2s"
    begin="5s"
    values="0;1"
    fill="freeze"/>
  
  <!-- Navigation hint -->
  <text x="320" y="540" font-family="IPAexGothic" font-size="16" fill="#777777" text-anchor="middle">
    4コマ構成：知識の循環
  </text>
</svg>
