<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480">
  <!-- Panel background (落語屋の居間) -->
  <rect x="0" y="0" width="640" height="480" fill="#FFF8E1"/>
  <rect x="50" y="50" width="220" height="300" fill="#8D6E63" rx="5"/>
  <rect x="70" y="70" width="180" height="260" fill="#FFF" stroke="#3E2723" stroke-width="3"/>
  <text x="90" y="120" font-family="sans-serif" font-size="20" fill="#3E2723">評価ツール</text>
  <text x="90" y="150" font-family="sans-serif" font-size="16" fill="#3E2723">精度: 98.5%</text>
  <text x="90" y="180" font-family="sans-serif" font-size="16" fill="#3E2723">再現率: 96.2%</text>
  <!-- はっちゃん -->
  <circle cx="420" cy="200" r="40" fill="#FFCCBC"/>
  <path d="M390,200 Q420,150 450,200" fill="none" stroke="#3E2723" stroke-width="3"/>
  <text x="370" y="170" font-family="sans-serif" font-size="20" fill="#3E2723">はっちゃん</text>
  <text x="300" y="400" font-family="sans-serif" font-size="18" fill="#3E2723">「評価はできるが、知識にどう繋がる？」</text>
</svg>
