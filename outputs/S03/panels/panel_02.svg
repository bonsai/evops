<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480">
  <!-- Panel background -->
  <rect x="0" y="0" width="640" height="480" fill="#E8F5E9"/>
  <rect x="50" y="50" width="260" height="300" fill="#2E7D32" rx="5"/>
  <rect x="70" y="70" width="200" height="260" fill="#FFF" stroke="#1B5E20" stroke-width="3"/>
  <!-- ご隠居さん -->
  <circle cx="370" cy="200" r="40" fill="#FFE0B2"/>
  <path d="M340,200 Q370,150 400,200" fill="none" stroke="#3E2723" stroke-width="3"/>
  <text x="330" y="170" font-family="sans-serif" font-size="20" fill="#3E2723">ご隠居さん</text>
  <text x="260" y="400" font-family="sans-serif" font-size="18" fill="#3E2723">「細粒度評価を自動評価へ変換するんだ」</text>
  <!-- 教え方の説明 -->
  <text x="90" y="350" font-family="sans-serif" font-size="18" fill="#1B5E20">
    自動評価エンジン → 設定ファイル変更<br>
    閾値調整 → 即時適用
  </text>
  <!-- 吹きき風 -->
  <path d="M30,250 Q50,200 80,250 Q110,300 80,350" fill="none" stroke="#1B5E20" stroke-width="2"/>
</svg>
