<?xml version="1.0" encoding="UTF-8"?><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760"><style>text{font-family:"Noto Sans JP","Yu Gothic",sans-serif;fill:#24103f}.body{font-size:24px}.panel{fill:#fff;stroke:#7c3aed;stroke-width:5}@keyframes pulse{50%{opacity:.4}}.dot{animation:pulse 2s infinite}</style><rect width="1200" height="760" fill="#faf7ff"/><rect width="1200" height="90" fill="#7c3aed"/><text x="45" y="56" font-size="24" fill="white" style="fill:white;font-weight:800">P21 · SF PAPER COMIC</text><text x="600" y="56" text-anchor="middle" font-size="30" fill="white" style="fill:white;font-weight:800">False Dawn</text><text x="600" y="128" text-anchor="middle" font-size="28" style="font-weight:800">数字が伸びた。本当に賢くなった？</text><g><rect class="panel" x="55" y="165" width="520" height="230" rx="18"/><text x="77" y="205" font-size="34" style="font-weight:800">①</text><text class="body" x="125" y="257"><tspan x="125" dy="0">研究員「スコアが上がりました！」博士「待て」</tspan></text><circle class="dot" cx="525" cy="355" r="20" fill="#7c3aed"/></g><g><rect class="panel" x="610" y="165" width="520" height="230" rx="18"/><text x="632" y="205" font-size="34" style="font-weight:800">②</text><text class="body" x="680" y="257"><tspan x="680" dy="0">評価条件や比較方法で見かけの差が消えるかもしれない。</tspan></text><circle class="dot" cx="1080" cy="355" r="20" fill="#7c3aed"/></g><g><rect class="panel" x="55" y="435" width="520" height="230" rx="18"/><text x="77" y="475" font-size="34" style="font-weight:800">③</text><text class="body" x="125" y="527"><tspan x="125" dy="0">性能向上を慎重に再評価する。</tspan></text><circle class="dot" cx="525" cy="625" r="20" fill="#7c3aed"/></g><g><rect class="panel" x="610" y="435" width="520" height="230" rx="18"/><text x="632" y="475" font-size="34" style="font-weight:800">④</text><text class="body" x="680" y="527"><tspan x="680" dy="0">博士「評価器を信じる前に評価そのものを評価せよ」</tspan></text><circle class="dot" cx="1080" cy="625" r="20" fill="#7c3aed"/></g><text x="600" y="725" text-anchor="middle" font-size="18">論文 → SF四コマ → 生成・評価ループ</text></svg>