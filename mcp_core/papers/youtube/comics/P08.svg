<?xml version="1.0" encoding="UTF-8"?><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760"><style>text{font-family:"Noto Sans JP","Yu Gothic",sans-serif;fill:#24103f}.title{font-size:30px;font-weight:800}.body{font-size:24px}.panel{fill:#fff;stroke:#7c3aed;stroke-width:5}@keyframes pulse{50%{opacity:.4}}.dot{animation:pulse 2s infinite}</style><rect width="1200" height="760" fill="#faf7ff"/><rect width="1200" height="90" fill="#7c3aed"/><text x="45" y="56" font-size="24" fill="white" style="fill:white;font-weight:800">P08 · SF PAPER COMIC</text><text x="600" y="56" text-anchor="middle" font-size="30" fill="white" style="fill:white;font-weight:800">Magic3D</text><text x="600" y="128" text-anchor="middle" font-size="28" style="font-weight:800">最初は粗く、最後に美しく</text><g><rect class="panel" x="55" y="165" width="520" height="230" rx="18"/><text x="77" y="205" font-size="34" style="font-weight:800">①</text><text class="body" x="125" y="257"><tspan x="125" dy="0">低解像度の謎の立体が現れた。</tspan></text><circle class="dot" cx="525" cy="355" r="20" fill="#7c3aed"/></g><g><rect class="panel" x="610" y="165" width="520" height="230" rx="18"/><text x="632" y="205" font-size="34" style="font-weight:800">②</text><text class="body" x="680" y="257"><tspan x="680" dy="0">AI「まず形、次に高精細化します」</tspan></text><circle class="dot" cx="1080" cy="355" r="20" fill="#7c3aed"/></g><g><rect class="panel" x="55" y="435" width="520" height="230" rx="18"/><text x="77" y="475" font-size="34" style="font-weight:800">③</text><text class="body" x="125" y="527"><tspan x="125" dy="0">多段階Text-to-3Dで高解像度化。</tspan></text><circle class="dot" cx="525" cy="625" r="20" fill="#7c3aed"/></g><g><rect class="panel" x="610" y="435" width="520" height="230" rx="18"/><text x="632" y="475" font-size="34" style="font-weight:800">④</text><text class="body" x="680" y="527"><tspan x="680" dy="0">博士「一発勝負でなく段階的に進化させよう」</tspan></text><circle class="dot" cx="1080" cy="625" r="20" fill="#7c3aed"/></g><text x="600" y="725" text-anchor="middle" font-size="18">論文 → SF四コマ → 生成・評価ループ</text></svg>