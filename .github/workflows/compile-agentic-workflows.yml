name: Compile Agentic Workflows

on:
  push:
    paths:
      - ".github/workflows/*.md"
      - ".github/workflows/*.lock.yml"
      - ".github/aw.json"

permissions:
  contents: write

jobs:
  compile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install gh-aw
        uses: github/gh-aw/actions/setup-cli@main
        with:
          version: v0.37.18
          github-token: ${{ github.token }}

      - name: Compile
        run: gh aw compile paper-animation --strict

      - name: Commit compiled lock file
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/paper-animation.lock.yml
          if git diff --cached --quiet; then
            echo "No lock-file changes."
            exit 0
          fi
          git commit -m "Compile paper animation AW workflow"
          git push
